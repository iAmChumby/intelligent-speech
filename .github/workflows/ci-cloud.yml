name: CI — Non-GPU (cloud)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Non-GPU tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CUDA DLL packages first
        run: pip install nvidia-cublas-cu12 "nvidia-cudnn-cu12==9.8.0.87"

      - name: Install ctranslate2 (pinned)
        run: pip install ctranslate2==4.7.1

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify ctranslate2 imports
        run: python -c "import ctranslate2; print(f'ctranslate2 {ctranslate2.__version__} OK')"

      - name: Run non-GPU tests
        run: python -m pytest tests/ -m "not gpu" -v
